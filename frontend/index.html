<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>بيدر - نظام المبيعات</title>



  <script>
    // Global fallback for Wails bindings (browser/dev/E2E environment fallback)
    if (typeof window !== 'undefined' && !window.go) {
      const recursiveHandler = {
        get(target, prop) {
          if (prop === 'then') return undefined; // Prevent promise-like chaining traps
          if (typeof target[prop] === 'undefined') {
            const fn = function() { return Promise.resolve(null); };
            target[prop] = new Proxy(fn, recursiveHandler);
          }
          return target[prop];
        }
      };
      window.go = new Proxy({}, recursiveHandler);
      window.runtime = new Proxy({}, recursiveHandler);
    }
  </script>

  <!-- External Libraries (Loaded Locally for Offline Support) -->
  <!-- Tailwind is handled by Vite build, so no script tag needed here for main app -->
  <script src="/libs/JsBarcode.all.min.js"></script>
  <!-- qrcode and html5-qrcode should ideally be imported, but we keep them here if relied upon globally -->
  <!-- <script src="/libs/qrcode.min.js"></script> -->
  <!-- <script src="/libs/html5-qrcode.min.js"></script> -->

  <!-- Fonts are now loaded via @fontsource packages in main.tsx for offline support -->
  <!-- CSS is imported via main.tsx for proper Vite bundling -->
  <style>
    /* Critical inline styles for immediate render - prevents FOUC */
    html,
    body {
      background-color: #18191D;
      overflow: hidden;
      margin: 0;
      padding: 0;
      /* Disable pinch-to-zoom on touch devices */
      touch-action: pan-x pan-y;
      -ms-touch-action: pan-x pan-y;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Prevent all touch zoom gestures */
    * {
      touch-action: pan-x pan-y;
      -webkit-touch-callout: none;
    }

    /* Drag regions for desktop app */
    .app-drag {
      --wails-draggable: drag;
    }

    .app-no-drag {
      --wails-draggable: no-drag;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Prevent pinch-to-zoom and Ctrl+wheel zoom
    document.addEventListener('wheel', function (e) {
      if (e.ctrlKey) {
        e.preventDefault();
      }
    }, { passive: false });

    // Prevent multi-touch zoom gestures
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // Prevent gesture events (Safari/WebKit)
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('gesturechange', function (e) {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('gestureend', function (e) {
      e.preventDefault();
    }, { passive: false });
  </script>
</body>

</html>
