name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # 1. Go Backend: Fast Parallel Tests & Verification
  # ═══════════════════════════════════════════════════════════════════
  go-backend:
    name: Go Backend (Vet & Fast Test Suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy frontend dist for Go embed
        run: |
          mkdir -p frontend/dist
          echo "<!DOCTYPE html><html><head><title>Beidar</title></head><body></body></html>" > frontend/dist/index.html

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Vet
        run: go vet ./internal/... ./pkg/...

      - name: Fast Test Suite
        run: go test -p 4 ./internal/... ./pkg/...

      - name: Race Detection (Core & Security)
        run: go test -race ./internal/core/domain ./pkg/auth ./pkg/crypto ./pkg/errors ./pkg/validator ./pkg/logger

  # ═══════════════════════════════════════════════════════════════════
  # 2. React Frontend: Ultra-Fast Parallel Check & Vitest Suite
  # ═══════════════════════════════════════════════════════════════════
  frontend:
    name: React Frontend (Types, Lint & 330+ Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit & Component Vitest Suite
        run: npx vitest run --pool=threads --maxConcurrency=4

      - name: Fast Production Build Check
        run: npx vite build

  # ═══════════════════════════════════════════════════════════════════
  # 3. Playwright E2E Tests (Parallelized Chromium)
  # ═══════════════════════════════════════════════════════════════════
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npx playwright test --workers=2 --project=chromium
        env:
          CI: true

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 5
