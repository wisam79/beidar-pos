name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # 0. Documentation Gate (mandatory)
  #   → يفشل عند انحراف الأرقام المرجعية أو وجود مستند غير مسجَّل في الجرد أو
  #     تغيير كود بلا توثيق مرافق أو عودة عيب مُثبَّت بتأكيد كودي.
  #   المرجع: docs/DOCUMENTATION_MAP.md
  # ═══════════════════════════════════════════════════════════════════
  docs-gate:
    name: Documentation Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Documentation Sync Gate
        run: node scripts/docs-gate.mjs --push --ci

  # ═══════════════════════════════════════════════════════════════════
  # 1. Go Backend: Fast Parallel Tests & Verification
  # ═══════════════════════════════════════════════════════════════════
  go-backend:
    name: Go Backend (Vet, Tests & Coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy frontend dist for Go embed
        run: |
          mkdir -p frontend/dist
          echo "<!DOCTYPE html><html><head><title>Beidar</title></head><body></body></html>" > frontend/dist/index.html

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Go dependencies
        run: go mod download

      - name: Vet
        run: go vet ./internal/... ./pkg/...

      # قياس تغطية شامل: كل كود الإنتاج مُجهَّز للقياس (-coverpkg) حتى لا يتغيّر
      # المقام عند إضافة أول ملف اختبار لحزمة كانت بلا اختبارات، وحتى يُقاس الكود
      # الذي تغطّيه اختبارات حزمة أخرى.
      - name: Test Suite with Coverage
        run: |
          go test -p 4 -covermode=atomic \
            -coverpkg=./internal/core/...,./internal/handlers/...,./internal/integration/...,./internal/network/...,./internal/repository/...,./internal/service/...,./pkg/... \
            -coverprofile=coverage.out \
            ./internal/... ./pkg/...

      - name: Coverage Report (Job Summary)
        run: node scripts/coverage-gate.mjs --profile=coverage.out

      # سقّاطة التغطية: تمنع التراجع عن الخط الأساس المُقاس سحابياً (57.7% تغطية كلية).
      # لا تُخفَّض إلا بقرار موثّق في CHANGELOG.md.
      - name: Coverage Ratchet Gate
        run: node scripts/coverage-gate.mjs --profile=coverage.out --min=57.5

      - name: Upload Coverage Profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14

      - name: Race Detection (Core & Security)
        run: go test -race ./internal/core/domain ./pkg/auth ./pkg/crypto ./pkg/errors ./pkg/validator ./pkg/logger

  # ═══════════════════════════════════════════════════════════════════
  # 2. React Frontend: Ultra-Fast Parallel Check & Vitest Suite
  # ═══════════════════════════════════════════════════════════════════
  frontend:
    name: React Frontend (Types, Lint & 330+ Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit & Component Vitest Suite
        run: npx vitest run --fileParallelism=false

      - name: Fast Production Build Check
        run: npx vite build

  # ═══════════════════════════════════════════════════════════════════
  # 3. Playwright E2E Tests (Parallelized Chromium)
  # ═══════════════════════════════════════════════════════════════════
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npx playwright test --workers=2 --project=chromium
        env:
          CI: true

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 5
