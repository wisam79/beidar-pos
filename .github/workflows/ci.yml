name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # 1. Go Backend: Fast Parallel Matrix & Tests
  # ═══════════════════════════════════════════════════════════════════
  go-backend:
    name: Go Backend (Lint, Vet & Race Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy frontend dist for Go embed
        run: |
          mkdir -p frontend/dist
          echo "<!DOCTYPE html><html><head><title>Beidar</title></head><body></body></html>" > frontend/dist/index.html

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Vet
        run: go vet ./internal/... ./pkg/...

      - name: Test with Race Detection & Coverage
        run: go test -race -count=1 -coverprofile=coverage.out ./internal/... ./pkg/...

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════
  # 2. React Frontend: Typecheck, Lint, Audit & Unit Tests
  # ═══════════════════════════════════════════════════════════════════
  frontend:
    name: React Frontend (Types, Lint & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate || true

      - name: Unit & Component Tests
        run: npm run test:ci

      - name: Fast Production Build Check
        run: npx vite build

  # ═══════════════════════════════════════════════════════════════════
  # 3. Playwright E2E Tests (Parallelized Chromium)
  # ═══════════════════════════════════════════════════════════════════
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
